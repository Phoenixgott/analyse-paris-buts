name: Historiques des ligues (football-data.co.uk)

# Fichiers publics, sans clé ni compte. Chaque nuit : téléchargement, commit si quelque chose a
# changé, puis mise en ligne du site (un push fait avec GITHUB_TOKEN ne déclenche pas deploy.yml).
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: historiques
  cancel-in-progress: false

jobs:
  telecharger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      change: ${{ steps.commit.outputs.change }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Télécharger les historiques
        run: node scripts/historiques/telecharger.js
      - name: Backtest du modèle (page Fiabilité)
        run: node scripts/backtest/backtest.js
      - name: Commit si changement
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ligues
          # Le backtest n'est commité que si les historiques ont changé (sinon seule sa date bougerait).
          if ! git diff --cached --quiet; then git add data/backtest; fi
          if git diff --cached --quiet; then
            echo "change=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Historiques des ligues : mise à jour $(date -u +%F)"
            git push
            echo "change=true" >> "$GITHUB_OUTPUT"
          fi

  deployer:
    needs: telecharger
    if: needs.telecharger.outputs.change == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
